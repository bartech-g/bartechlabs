process:
  title: Ötlet → App
  aside: hogyan zajlik egy projekt
  steps:
    - title: Ötlet
      text: Elmondod, mi a probléma. Egy hívás, egy dokumentum, egy szalvétára firkált vázlat - bármi, ami van.
    - title: Terjedelem
      text: Leírom, mi készül el és mi nem, ütemtervvel és fix árral.
    - title: Tervezés
      text: Drótvázak és képernyők a fő folyamatokhoz. Kódolás előtt jóváhagyod őket.
    - title: Fejlesztés
      text: Frontend, backend, adatbázis. Heti bemutató egy élő teszt linken.
    - title: Élesítés
      text: Telepítés, domain, monitorozás, átadási dokumentáció. Utána támogatás, ha kéred.

