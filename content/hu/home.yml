about:
  title: Rólam
  paragraphs:
    - A Bartech Labs egyszemélyes stúdió. Egy nyers ötletből világos terjedelmet készítek, majd megtervezem, megépítem és élesítem. Azzal beszélsz, aki felel a kódért.
    - "Jól illik hozzám: MVP-k, belső eszközök, dashboardok, API-k, félbehagyott projektek megmentése. Nem nekem való: ami húszfős csapatot igényel."
  stackLabel: technológiák
  stack:
    - label: Frontend
      value: React, Next.js, TypeScript
    - label: Backend
      value: Node.js, Python, REST, GraphQL
    - label: Adatok
      value: PostgreSQL, Redis, Prisma
    - label: Infra
      value: Docker, AWS, Vercel, CI/CD

