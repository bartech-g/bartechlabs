  ctaPrimary: Start a project
  ctaSecondary: See work

process:
  title: Idea → App
  aside: how a project goes
  steps:
    - title: Idea
      text: You explain the problem. A call, a doc, a napkin sketch — whatever you have.
    - title: Scope
      text: I write down what gets built, what doesn't, a timeline and a fixed price.
    - title: Design
      text: Wireframes and screens for the core flows. You sign off before code.
    - title: Build
      text: Frontend, backend, database. Weekly demo on a live staging link.
    - title: Launch
      text: Deploy, domain, monitoring, handover docs. Then support if you want it.

